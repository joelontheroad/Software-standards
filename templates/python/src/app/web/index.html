<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mytool - Local Utility</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --border: #334155;
      --success: #10b981;
      --error: #ef4444;
      --focus-ring: #38bdf8;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #0284c7;
        --primary-hover: #0369a1;
        --border: #e2e8f0;
        --focus-ring: #0284c7;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    header {
      max-width: 800px;
      width: 100%;
      margin: 0 auto 2rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    main {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    input, select {
      width: 100%;
      padding: 0.625rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
    }

    input:focus, select:focus, button:focus, a:focus {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: #0f172a;
      font-weight: 600;
      padding: 0.625rem 1.25rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .status-msg {
      margin-top: 1rem;
      font-size: 0.9rem;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      display: none;
    }

    .status-success {
      display: block;
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-error {
      display: block;
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }

    footer {
      max-width: 800px;
      width: 100%;
      margin: 2rem auto 0 auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer a {
      color: var(--primary);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">mytool</div>
    <div id="connectionStatus" style="font-size: 0.85rem; color: var(--text-muted);">● Localhost Only (127.0.0.1)</div>
  </header>

  <main>
    <section class="card" aria-labelledby="presetHeading">
      <h2 id="presetHeading">Preset Settings <span id="dirtyIndicator" style="display: none; color: var(--primary);">*</span></h2>
      <form id="presetForm">
        <div class="form-group">
          <label for="presetName">Preset Name</label>
          <input type="text" id="presetName" name="name" value="default" required>
        </div>

        <div class="form-group">
          <label for="themeSelect">Interface Theme</label>
          <select id="themeSelect" name="theme">
            <option value="auto">System Default (Auto)</option>
            <option value="dark">Dark Theme</option>
            <option value="light">Light Theme</option>
          </select>
        </div>

        <div class="form-group">
          <label for="maxItems">Maximum Items (1 - 1000)</label>
          <input type="number" id="maxItems" name="max_items" value="50" min="1" max="1000" required>
        </div>

        <button type="submit" class="btn" id="saveBtn">Save Preset</button>
        <div id="statusAlert" class="status-msg" role="alert"></div>
      </form>
    </section>
  </main>

  <footer>
    <div>mytool v0.1.0 • Privacy by Design (Zero Telemetry)</div>
    <!-- AGPL-3.0 Section 13 Source Code Notice Requirement -->
    <div>
      <a href="https://github.com/username/mytool" target="_blank" rel="noopener noreferrer">Source Code (GNU AGPLv3)</a>
    </div>
  </footer>

  <script>
    // Offline-only local script
    const form = document.getElementById('presetForm');
    const dirtyIndicator = document.getElementById('dirtyIndicator');
    const statusAlert = document.getElementById('statusAlert');

    // Extract ephemeral launch token from URL query string if present
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function loadPresetData() {
      try {
        const res = await fetch('/api/preset', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });
        if (res.ok) {
          const data = await res.json();
          document.getElementById('presetName').value = data.name || 'default';
          document.getElementById('themeSelect').value = data.theme || 'auto';
          document.getElementById('maxItems').value = data.max_items || 50;
        }
      } catch (err) {
        console.error('Failed to load initial preset', err);
      }
    }

    form.addEventListener('input', () => {
      dirtyIndicator.style.display = 'inline';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusAlert.className = 'status-msg';
      statusAlert.style.display = 'none';

      const payload = {
        name: document.getElementById('presetName').value,
        theme: document.getElementById('themeSelect').value,
        max_items: parseInt(document.getElementById('maxItems').value, 10),
        enable_cache: true
      };

      try {
        const res = await fetch('/api/preset', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          dirtyIndicator.style.display = 'none';
          statusAlert.textContent = 'Preset saved successfully to local filesystem.';
          statusAlert.className = 'status-msg status-success';
        } else {
          const err = await res.json();
          statusAlert.textContent = err.detail || 'Failed to save preset.';
          statusAlert.className = 'status-msg status-error';
        }
      } catch (err) {
        statusAlert.textContent = 'Network or server error.';
        statusAlert.className = 'status-msg status-error';
      }
    });

    loadPresetData();
  </script>
</body>
</html>
